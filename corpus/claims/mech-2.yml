en:
  key: embedding vector representation semantic
  nat: What is an embedding? The vector representation.
  value: Sentences close in meaning become close vectors. So even different wording tends to land on
    the same pattern.
  spans:
    - id: vec-close
      text: Sentences close in meaning become close vectors.
      tags:
        - embedding
        - mechanism
      nliHypothesis: The user is asking about semantically close vectors.
    - id: paraphrase
      text: So even different wording tends to land on the same pattern.
      tags:
        - embedding
        - paraphrase
        - mechanism
      nliHypothesis: The user is asking about wording differences.
