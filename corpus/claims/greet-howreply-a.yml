claim: greet-howreply-a
speaker: bot
tags:
  - mechanism
stance: affirm
edges:
  - rel: parallel
    to: var-add
ja:
  key: え どうやって返事 返事してるの どうやって返答 返答してる どう答えてる
  nat: どうやって返事しているの？検索で返答を選んでいるの？
  sameIntent:
    - どうやって返答してる？
    - どうやって答えてる？
    - どう返答してる？
  value: 今の発話を埋め込み → 近いキーのチャンクを探す → その value を返す。生成ゼロ。
  spans:
    - id: embed-step
      text: "今の発話を埋め込み → "
      tags:
        - mechanism
        - embedding
    - id: search-step
      text: "近いキーのチャンクを探す → "
      tags:
        - mechanism
        - retrieval
    - id: return-step
      text: その value を返す。
      tags:
        - mechanism
        - retrieval
    - id: zero-gen
      text: 生成ゼロ。
      tags:
        - no-generation
        - summary
  assertion:
    - あなたは検索（近傍探索）で返答を選んでいる。
    - あなたは埋め込みの類似度で返答を選んでいる。
